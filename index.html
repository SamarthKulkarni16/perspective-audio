<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perspective Audio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpeg" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rye&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --surface: #0a0a0a;
      --surface2: #111;
      --border: rgba(255,255,255,0.07);
      --text: #f0f0f0;
      --muted: #666;
      --accent: #e8e8e8;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOADING ── */
    #loading-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .spinner {
      width: 28px; height: 28px; border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #ccc; border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── AUTH SCREEN ── */
    #auth-screen {
      min-height: 100vh; display: none; align-items: center;
      justify-content: center; padding: 24px;
    }
    .auth-box { width: 100%; max-width: 380px; }
    .auth-header { text-align: center; margin-bottom: 36px; }
    .auth-logo { display: block; margin: 0 auto 18px; width: 72px; height: 72px; border-radius: 50%; overflow: hidden; }
    .auth-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .auth-title { font-family: 'Rye', serif; font-size: 24px; color: var(--text); letter-spacing: 0.02em; }
    .auth-sub { margin-top: 6px; font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
    .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 28px; }

    .divider {
      display: flex; align-items: center; gap: 12px; margin: 22px 0;
      color: var(--muted); font-size: 11px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .auth-tabs { display: flex; gap: 0; margin-bottom: 24px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .auth-tab {
      flex: 1; padding: 8px; font-size: 11px; font-family: 'Inter', sans-serif;
      background: none; border: none; color: var(--muted); cursor: pointer;
      transition: background 0.15s, color 0.15s; letter-spacing: 0.04em;
    }
    .auth-tab.active { background: var(--surface2); color: var(--text); }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .field input {
      width: 100%; background: #050505; border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text);
      outline: none; transition: border-color 0.15s;
    }
    .field input::placeholder { color: #444; }
    .field input:focus { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }

    .btn-enter {
      width: 100%; background: #f0f0f0; color: #0f0f0f; border: none; border-radius: 12px;
      padding: 13px; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s; margin-top: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); letter-spacing: 0.03em;
    }
    .btn-enter:hover { opacity: 0.9; }
    .btn-enter:active { transform: scale(0.99); }
    .btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

    .auth-error {
      font-size: 11px; color: #e05555; margin-top: 12px; min-height: 16px; text-align: center;
    }

    /* ── LIBRARY SCREEN ── */
    #library-screen { display: none; min-height: 100vh; }

    /* ── HEADER ── */
    .lib-header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .lib-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .lib-brand-logo { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .lib-brand-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lib-brand-name { font-family: 'Rye', serif; font-size: 15px; color: var(--text); letter-spacing: 0.02em; }
    .lib-right { display: flex; align-items: center; gap: 16px; }

    .user-pill { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: #333;
      border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 700; color: #fff; overflow: hidden;
    }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .btn-nav {
      background: none; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px;
      font-family: 'Inter', sans-serif; font-size: 11px; color: var(--muted); cursor: pointer;
      transition: color 0.15s, border-color 0.15s; letter-spacing: 0.02em;
    }
    .btn-nav:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ── MAIN ── */
    .lib-main { max-width: 1100px; margin: 0 auto; padding: 48px 32px; }
    .lib-heading { margin-bottom: 40px; }
    .lib-heading-eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .lib-heading h1 { font-size: 32px; color: var(--text); letter-spacing: 0.02em; }

    /* ── BOOK GRID ── */
    #book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }

    .book-card { cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform 0.2s; }
    .book-card:hover { transform: translateY(-4px); }

    .book-cover {
      aspect-ratio: 2/3; border-radius: 6px 12px 12px 6px; position: relative; overflow: hidden;
      box-shadow: -4px 0 0 0 rgba(0,0,0,0.4), 4px 4px 20px rgba(0,0,0,0.6), inset -3px 0 6px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; justify-content: space-between; padding: 18px 14px;
    }
    .book-cover::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
      background: rgba(0,0,0,0.35); border-radius: 6px 0 0 6px; z-index: 1;
    }
    .book-cover::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .book-cover-play {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.25);
    }
    .book-card:hover .book-cover-play { opacity: 1; }
    .play-ring {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center;
    }
    .play-ring svg { width: 16px; height: 16px; fill: #fff; margin-left: 2px; }

    .book-category { position: relative; z-index: 2; font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
    .book-title-cover { position: relative; z-index: 2; font-size: 13px; line-height: 1.4; color: rgba(255,255,255,0.92); }

    .book-meta { display: flex; flex-direction: column; gap: 3px; }
    .book-title-below { font-size: 11px; color: var(--text); line-height: 1.4; }
    .book-subtitle-below { font-size: 10px; color: var(--muted); line-height: 1.4; }
    .book-readtime { font-size: 10px; color: #444; margin-top: 2px; }

    /* ── PLAYER MODAL ── */
    #modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 24px; overflow-y: auto;
    }
    #modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      width: 100%; max-width: 480px; margin: auto; padding: 0; overflow: hidden;
      animation: modal-in 0.2s ease;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-cover-bar { height: 6px; width: 100%; }
    .modal-header {
      padding: 28px 32px 0; display: flex; align-items: flex-start;
      justify-content: space-between; gap: 16px;
    }
    .modal-eyebrow { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .modal-title { font-size: 22px; line-height: 1.35; color: var(--text); }

    .modal-close {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: var(--text); background: #2a2a2a; }

    .modal-divider { margin: 24px 32px 0; height: 1px; background: var(--border); }

    /* ── PLAYER ── */
    .player-body { padding: 24px 32px 32px; }
    .player-controls { display: flex; align-items: center; gap: 16px; }

    .ctrl-play {
      flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%;
      background: #fff; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
    }
    .ctrl-play:hover { transform: scale(1.06); opacity: 0.9; }
    .ctrl-play svg { width: 18px; height: 18px; fill: #000; margin-left: 2px; }

    .player-right { flex: 1; display: flex; flex-direction: column; gap: 8px; }

    .player-progress {
      width: 100%; height: 4px; background: rgba(255,255,255,0.12);
      border-radius: 99px; cursor: pointer; position: relative; transition: height 0.15s;
    }
    .player-progress:hover { height: 6px; }
    .player-bar {
      height: 100%; background: #fff; border-radius: 99px;
      width: 0%; pointer-events: none; position: relative;
    }
    .player-thumb {
      position: absolute; top: 50%; right: -6px;
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; transform: translateY(-50%);
      opacity: 0; transition: opacity 0.15s; pointer-events: none;
    }
    .player-progress:hover .player-thumb { opacity: 1; }

    .player-times {
      display: flex; justify-content: space-between;
      font-size: 10px; color: var(--muted);
      font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      .lib-main { padding: 36px 20px; }
      .lib-header { padding: 0 20px; }
      #book-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 18px; }
      .modal-header { padding: 22px 20px 0; }
      .modal-divider { margin: 18px 20px 0; }
      .player-body { padding: 20px 20px 28px; }
      .modal-title { font-size: 18px; }
      .auth-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="spinner"></div>
</div>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">
        <img src="logo.jpeg" alt="Perspective Audio" />
      </div>
      <div class="auth-title">Perspective Audio</div>
      <div class="auth-sub">A private listening room.</div>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" onclick="switchTab('signin')">Sign in</button>
        <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
      </div>

      <div id="form-signin">
        <div class="field">
          <label>Email</label>
          <input type="email" id="si-email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="si-password" placeholder="••••••••" />
        </div>
        <button class="btn-enter" id="si-btn" onclick="doSignIn()">Enter Library</button>
        <div class="auth-error" id="si-error"></div>
      </div>

      <div id="form-signup" style="display:none">
        <div class="field">
          <label>Email</label>
          <input type="email" id="su-email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="su-password" placeholder="min 6 characters" />
        </div>
        <button class="btn-enter" id="su-btn" onclick="doSignUp()">Create account</button>
        <div class="auth-error" id="su-error"></div>
      </div>
    </div>
  </div>
</div>

<!-- LIBRARY SCREEN -->
<div id="library-screen">
  <header class="lib-header">
    <a class="lib-brand" href="#">
      <div class="lib-brand-logo">
        <img src="logo.jpeg" alt="Perspective Audio" />
      </div>
      <span class="lib-brand-name">Perspective Audio</span>
    </a>
    <div class="lib-right">
      <div class="user-pill">
        <div class="user-avatar" id="user-avatar-el"></div>
      </div>
      <button class="btn-nav" id="btn-signout">Sign out</button>
    </div>
  </header>

  <main class="lib-main">
    <div class="lib-heading">
      <div class="lib-heading-eyebrow">Your Collection</div>
      <h1>The Library</h1>
    </div>
    <div id="book-grid"></div>
  </main>
</div>

<!-- PLAYER MODAL -->
<div id="modal-overlay">
  <div class="modal">
    <div class="modal-cover-bar" id="modal-cover-bar"></div>
    <div class="modal-header">
      <div>
        <div class="modal-eyebrow" id="modal-eyebrow"></div>
        <div class="modal-title" id="modal-title"></div>
      </div>
      <button class="modal-close" id="modal-close">&#215;</button>
    </div>
    <div class="modal-divider"></div>
    <div class="player-body">
      <div class="player-controls">
        <button class="ctrl-play" id="playBtn">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="player-right">
          <div class="player-progress" id="progressBar">
            <div class="player-bar" id="progressFill">
              <div class="player-thumb"></div>
            </div>
          </div>
          <div class="player-times">
            <span id="timeElapsed">0:00</span>
            <span id="timeDuration">0:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<audio id="audioEl"></audio>

<script>
// ── FIREBASE ──
firebase.initializeApp({
  apiKey: "AIzaSyDSi-_yS2SeW6QqvSxfkJ7RHJZ-ArMz0j0",
  authDomain: "perspective-library.firebaseapp.com",
  projectId: "perspective-library",
  storageBucket: "perspective-library.firebasestorage.app",
  messagingSenderId: "960053593256",
  appId: "1:960053593256:web:030144d380de81dcf12e9d"
});
const auth = firebase.auth();

// ── R2 BASE URL ──
const R2 = "https://pub-e5b2f14df3a14e9893d39e0d56b54eff.r2.dev";

// ── AUDIOBOOKS ──
const AUDIOBOOKS = [
  {
    title: "How To Use Anger To Your Advantage",
    subtitle: "Anger is not a problem if you know what it is",
    category: "Emotions",
    color: "linear-gradient(135deg, #1a1a2e, #16213e)",
    duration: "3 min",
    src: `${R2}/anger.mp3`
  },
  {
    title: "Use Procrastination To Your Advantage",
    subtitle: "Stop fighting it. Start redirecting it.",
    category: "Productivity",
    color: "linear-gradient(135deg, #0f2027, #203a43, #2c5364)",
    duration: "4 min",
    src: `${R2}/procrastination.mp3`
  },
  {
    title: "Use Conflicts To Your Advantage",
    subtitle: "You don't need to escape problems. You need to upgrade them.",
    category: "Mindset",
    color: "linear-gradient(135deg, #1a0a00, #3d1f00, #1a0a00)",
    duration: "6 min",
    src: `${R2}/conflicts.mp3`
  },
  {
    title: "Survival",
    subtitle: "Understanding the basic of everything we do.",
    category: "Psychology",
    color: "linear-gradient(135deg, #0a1628, #1a3a2a, #0a1628)",
    duration: "12 min",
    src: `${R2}/survival.mp3`
  },
];

// ── SCREENS ──
const loadingScreen  = document.getElementById('loading-screen');
const authScreen     = document.getElementById('auth-screen');
const libraryScreen  = document.getElementById('library-screen');

let currentUser = null;

const authTimeout = setTimeout(() => {
  loadingScreen.style.display = 'none';
  authScreen.style.display    = 'flex';
}, 5000);

auth.onAuthStateChanged(user => {
  clearTimeout(authTimeout);
  loadingScreen.style.display = 'none';
  currentUser = user;
  if (user) {
    showLibrary(user);
  } else {
    authScreen.style.display   = 'flex';
    libraryScreen.style.display = 'none';
  }
});

function showLibrary(user) {
  authScreen.style.display    = 'none';
  libraryScreen.style.display = 'block';
  const avatarEl = document.getElementById('user-avatar-el');
  if (user.photoURL) {
    avatarEl.innerHTML = `<img src="${user.photoURL}" alt="" />`;
  } else {
    const name = user.displayName || user.email || '?';
    avatarEl.textContent = name[0].toUpperCase();
  }
  renderBooks();
}

// ── AUTH ──
function switchTab(tab) {
  document.getElementById('form-signin').style.display = tab === 'signin' ? '' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? '' : 'none';
  document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('si-error').textContent = '';
  document.getElementById('su-error').textContent = '';
}

function friendlyError(code) {
  const map = {
    'auth/user-not-found':      'No account found with this email.',
    'auth/wrong-password':      'Incorrect password.',
    'auth/invalid-email':       'Please enter a valid email.',
    'auth/email-already-in-use':'An account with this email already exists.',
    'auth/weak-password':       'Password must be at least 6 characters.',
    'auth/invalid-credential':  'Incorrect email or password.',
    'auth/too-many-requests':   'Too many attempts. Try again later.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

async function doSignIn() {
  const email = document.getElementById('si-email').value.trim();
  const pass  = document.getElementById('si-password').value;
  const btn   = document.getElementById('si-btn');
  const err   = document.getElementById('si-error');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Please fill in all fields.'; return; }
  btn.disabled = true; btn.textContent = 'Entering…';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    err.textContent = friendlyError(e.code);
  }
  btn.disabled = false; btn.textContent = 'Enter Library';
}

async function doSignUp() {
  const email = document.getElementById('su-email').value.trim();
  const pass  = document.getElementById('su-password').value;
  const btn   = document.getElementById('su-btn');
  const err   = document.getElementById('su-error');
  err.textContent = '';
  if (!email || !pass) { err.textContent = 'Please fill in all fields.'; return; }
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    await auth.createUserWithEmailAndPassword(email, pass);
  } catch(e) {
    err.textContent = friendlyError(e.code);
  }
  btn.disabled = false; btn.textContent = 'Create account';
}

document.getElementById('btn-signout').addEventListener('click', () => auth.signOut());

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const siVisible = document.getElementById('form-signin').style.display !== 'none';
    if (siVisible) doSignIn();
    else doSignUp();
  }
});

// ── BOOK GRID ──
function renderBooks() {
  const grid = document.getElementById('book-grid');
  grid.innerHTML = '';
  AUDIOBOOKS.forEach(book => {
    const card = document.createElement('div');
    card.className = 'book-card';
    card.innerHTML = `
      <div class="book-cover" style="background: ${book.color}">
        <div class="book-category">${book.category}</div>
        <div class="book-title-cover">${book.title}</div>
        <div class="book-cover-play">
          <div class="play-ring">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="book-meta">
        <div class="book-title-below">${book.title}</div>
        ${book.subtitle ? `<div class="book-subtitle-below">${book.subtitle}</div>` : ''}
        <div class="book-readtime">${book.duration} listen</div>
      </div>
    `;
    card.addEventListener('click', () => openPlayer(book));
    grid.appendChild(card);
  });
}

// ── PLAYER ──
const audio        = document.getElementById('audioEl');
const overlay      = document.getElementById('modal-overlay');
const playIcon     = document.getElementById('playIcon');
const progressFill = document.getElementById('progressFill');
const timeElapsed  = document.getElementById('timeElapsed');
const timeDuration = document.getElementById('timeDuration');
let ticker;

const PLAY_SVG  = '<path d="M8 5v14l11-7z"/>';
const PAUSE_SVG = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

function openPlayer(book) {
  document.getElementById('modal-eyebrow').textContent        = book.category;
  document.getElementById('modal-title').textContent          = book.title;
  document.getElementById('modal-cover-bar').style.background = book.color;
  timeDuration.textContent = book.duration || '0:00';
  resetPlayer();
  audio.src = book.src;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePlayer() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  audio.pause();
  clearInterval(ticker);
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playIcon.innerHTML = PAUSE_SVG;
    ticker = setInterval(updateProgress, 250);
  } else {
    audio.pause();
    playIcon.innerHTML = PLAY_SVG;
    clearInterval(ticker);
  }
}

function updateProgress() {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeElapsed.textContent  = fmt(audio.currentTime);
  timeDuration.textContent = fmt(audio.duration);
}

function resetPlayer() {
  progressFill.style.width = '0%';
  timeElapsed.textContent  = '0:00';
  playIcon.innerHTML       = PLAY_SVG;
  clearInterval(ticker);
}

function fmt(s) {
  const m   = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return m + ':' + sec;
}

document.getElementById('progressBar').addEventListener('click', e => {
  if (!audio.duration) return;
  const r = document.getElementById('progressBar').getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  updateProgress();
});

let dragging = false;
document.getElementById('progressBar').addEventListener('mousedown', () => { dragging = true; });
document.addEventListener('mousemove', e => {
  if (!dragging || !audio.duration) return;
  const r = document.getElementById('progressBar').getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  audio.currentTime = pct * audio.duration;
  updateProgress();
});
document.addEventListener('mouseup', () => { dragging = false; });

audio.addEventListener('ended', () => {
  playIcon.innerHTML       = PLAY_SVG;
  progressFill.style.width = '100%';
  clearInterval(ticker);
});

document.getElementById('playBtn').addEventListener('click', togglePlay);
document.getElementById('modal-close').addEventListener('click', closePlayer);
overlay.addEventListener('click', e => { if (e.target === overlay) closePlayer(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePlayer();
  if (e.key === ' ' && overlay.classList.contains('open')) { e.preventDefault(); togglePlay(); }
});
</script>
</body>
</html>
